<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans);font-size:13px;color:var(--color-text-primary)}
.toolbar{display:flex;align-items:center;gap:8px;padding:10px 0 14px;flex-wrap:wrap}
.page-btn{padding:5px 12px;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);background:var(--color-background-primary);color:var(--color-text-secondary);cursor:pointer;font-size:12px;transition:all .15s}
.page-btn.active{background:var(--color-background-info);color:var(--color-text-info);border-color:var(--color-border-info)}
.toggle{display:flex;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);overflow:hidden;margin-left:auto}
.toggle button{padding:5px 14px;border:none;background:var(--color-background-primary);color:var(--color-text-secondary);cursor:pointer;font-size:12px}
.toggle button.active{background:var(--color-background-secondary);color:var(--color-text-primary);font-weight:500}
.frame{border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);overflow:hidden;background:var(--color-background-tertiary)}

/* lo-fi */
.lf-shell{display:flex;height:520px}
.lf-side{width:140px;background:#d3d1c7;padding:12px 8px;flex-shrink:0}
.lf-logo{height:20px;background:#888780;border-radius:3px;margin-bottom:16px}
.lf-nav-item{height:12px;background:#b4b2a9;border-radius:2px;margin-bottom:8px}
.lf-nav-item.active{background:#5f5e5a}
.lf-main{flex:1;display:flex;flex-direction:column}
.lf-topbar{height:38px;background:#e8e6df;border-bottom:0.5px solid #b4b2a9;display:flex;align-items:center;justify-content:flex-end;padding:0 12px;gap:8px}
.lf-tb-pill{height:10px;width:50px;background:#b4b2a9;border-radius:2px}
.lf-content{flex:1;padding:14px;overflow:hidden}
.lf-page-title{height:14px;width:120px;background:#888780;border-radius:2px;margin-bottom:14px}
.lf-row{display:flex;gap:10px;margin-bottom:10px}
.lf-card{background:#e8e6df;border-radius:4px;border:0.5px solid #b4b2a9;flex:1;padding:10px}
.lf-card-label{height:8px;width:60%;background:#b4b2a9;border-radius:2px;margin-bottom:6px}
.lf-card-value{height:18px;width:40%;background:#5f5e5a;border-radius:2px}
.lf-table-header{height:10px;background:#888780;border-radius:2px;margin-bottom:6px}
.lf-table-row{height:8px;background:#d3d1c7;border-radius:2px;margin-bottom:5px}
.lf-btn{height:24px;width:80px;background:#5f5e5a;border-radius:3px}
.lf-chart{background:#e8e6df;border-radius:4px;border:0.5px solid #b4b2a9;height:120px;display:flex;align-items:flex-end;gap:6px;padding:10px}
.lf-bar{background:#888780;border-radius:2px 2px 0 0;flex:1}
.lf-form-field{height:26px;background:#e8e6df;border-radius:3px;border:0.5px solid #b4b2a9;margin-bottom:8px}
.lf-form-label{height:8px;width:50px;background:#b4b2a9;border-radius:2px;margin-bottom:4px}
.lf-annotation{font-size:10px;color:#888780;margin-top:4px}

/* hi-fi */
.hf-shell{display:flex;height:520px}
.hf-sidebar{width:160px;background:#1a1a2e;padding:14px 10px;flex-shrink:0;display:flex;flex-direction:column}
.hf-logo{color:#fff;font-weight:500;font-size:15px;margin-bottom:20px;padding-left:4px}
.hf-nav{display:flex;flex-direction:column;gap:2px}
.hf-nav-item{padding:7px 10px;border-radius:6px;color:#9494b8;font-size:12px;cursor:pointer}
.hf-nav-item.active{background:#185fa5;color:#fff}
.hf-main{flex:1;display:flex;flex-direction:column;background:var(--color-background-tertiary)}
.hf-topbar{height:44px;background:var(--color-background-primary);border-bottom:0.5px solid var(--color-border-tertiary);display:flex;align-items:center;justify-content:flex-end;padding:0 16px;gap:10px}
.hf-avatar{width:28px;height:28px;border-radius:50%;background:#185fa5;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:500}
.hf-content{flex:1;padding:16px;overflow:hidden}
.hf-page-title{font-size:16px;font-weight:500;margin-bottom:14px;color:var(--color-text-primary)}
.hf-stat-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.hf-stat{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:8px;padding:10px 12px}
.hf-stat-label{font-size:11px;color:var(--color-text-secondary);margin-bottom:4px}
.hf-stat-value{font-size:20px;font-weight:500;color:var(--color-text-primary)}
.hf-stat-sub{font-size:10px;margin-top:2px}
.hf-card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:8px;padding:12px}
.hf-table{width:100%;border-collapse:collapse;font-size:12px}
.hf-table th{text-align:left;padding:6px 8px;border-bottom:0.5px solid var(--color-border-tertiary);color:var(--color-text-secondary);font-weight:500;font-size:11px}
.hf-table td{padding:6px 8px;border-bottom:0.5px solid var(--color-border-tertiary);color:var(--color-text-primary)}
.badge{display:inline-block;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:500}
.badge-success{background:#eaf3de;color:#27500a}
.badge-warning{background:#faeeda;color:#633806}
.badge-danger{background:#fcebeb;color:#791f1f}
.badge-info{background:#e6f1fb;color:#0c447c}
.badge-secondary{background:var(--color-background-secondary);color:var(--color-text-secondary)}
.hf-btn-primary{background:#185fa5;color:#fff;border:none;border-radius:6px;padding:6px 14px;font-size:12px;cursor:pointer}
.hf-btn-outline{background:transparent;border:0.5px solid var(--color-border-secondary);border-radius:6px;padding:6px 14px;font-size:12px;cursor:pointer;color:var(--color-text-primary)}
.hf-input{border:0.5px solid var(--color-border-secondary);border-radius:6px;padding:6px 10px;font-size:12px;width:100%;background:var(--color-background-primary);color:var(--color-text-primary)}
.hf-chart-bars{display:flex;align-items:flex-end;gap:5px;height:90px;padding:0 0 0}
.hf-bar{border-radius:3px 3px 0 0;flex:1;background:#185fa5;opacity:.8}
.hf-row{display:flex;gap:10px;margin-bottom:10px}
.hf-alert{background:#faeeda;border:0.5px solid #ef9f27;border-radius:6px;padding:8px 12px;font-size:12px;color:#633806;margin-bottom:10px}
</style>

<div class="toolbar">
  <button class="page-btn active" onclick="showPage('dashboard')">Dashboard</button>
  <button class="page-btn" onclick="showPage('login')">Login</button>
  <button class="page-btn" onclick="showPage('sales')">Sales</button>
  <button class="page-btn" onclick="showPage('inventory')">Inventory</button>
  <button class="page-btn" onclick="showPage('reports')">Reports</button>
  <button class="page-btn" onclick="showPage('receipts')">Receipts</button>
  <button class="page-btn" onclick="showPage('pos')">Purchase orders</button>
  <div class="toggle">
    <button class="active" onclick="setFidelity('lo')">Lo-fi</button>
    <button onclick="setFidelity('hi')">Hi-fi</button>
  </div>
</div>

<div class="frame" id="wireframe-area"></div>

function showPage(page){
  currentPage = page;
  document.querySelectorAll('.page-btn').forEach(b=>{
    b.classList.toggle('active', b.textContent.toLowerCase().replace(' ','')===page||b.textContent.toLowerCase()===page);
  });
  render();
}

function setFidelity(f){
  currentFidelity = f;
  document.querySelectorAll('.toggle button').forEach((b,i)=>{
    b.classList.toggle('active',(i===0&&f==='lo')||(i===1&&f==='hi'));
  });
  render();
}

}
