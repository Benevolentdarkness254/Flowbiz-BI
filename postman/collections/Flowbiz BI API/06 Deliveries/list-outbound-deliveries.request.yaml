$kind: http-request
name: List Outbound Deliveries
order: 1000
method: GET
url: '{{baseURL}}/api/deliveries/outbound'
queryParams:
  - key: status
    value: pending
    description: 'Filter by status: pending, in_transit, delivered, failed, rescheduled'
    disabled: true
  - key: page
    value: '1'
  - key: per_page
    value: '25'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // ── List Outbound Deliveries ──────────────────────────────────────────
      pm.test('List Outbound Deliveries returns 200 or 401/403', function () {
          pm.expect([200, 401, 403]).to.include(pm.response.code);
      });

      if (pm.response.code === 200) {
          pm.test('Outbound deliveries response contains a list', function () {
              var json = pm.response.json();
              var list = Array.isArray(json) ? json : (json.deliveries || json.data);
              pm.expect(list).to.be.an('array');
          });

          pm.test('Each delivery has id and status fields', function () {
              var json = pm.response.json();
              var list = Array.isArray(json) ? json : (json.deliveries || json.data);
              if (list.length > 0) {
                  pm.expect(list[0]).to.have.property('id');
                  pm.expect(list[0]).to.have.property('status');
              }
          });

          // Save first delivery id for downstream tests
          var json = pm.response.json();
          var list = Array.isArray(json) ? json : (json.deliveries || json.data);
          if (list.length > 0) {
              pm.collectionVariables.set('testDeliveryId', String(list[0].id));
          }
      }