$kind: http-request
name: Update Delivery GPS Location
order: 5000
method: PATCH
url: '{{baseURL}}/api/deliveries/outbound/{{testDeliveryId}}/location'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "lat": -1.2921,
      "lng": 36.8219
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // ── Update Delivery GPS Location ──────────────────────────────────────
      pm.test('Update GPS Location returns 200, 400, 401, 403, or 404', function () {
          pm.expect([200, 400, 401, 403, 404]).to.include(pm.response.code);
      });

      if (pm.response.code === 200) {
          pm.test('Location update response has message or delivery field', function () {
              var json = pm.response.json();
              pm.expect(json.message || json.delivery).to.exist;
          });
      }

      if (pm.response.code === 400) {
          pm.test('Invalid coordinates error has error or message field', function () {
              var json = pm.response.json();
              pm.expect(json.error || json.message).to.exist;
          });
      }