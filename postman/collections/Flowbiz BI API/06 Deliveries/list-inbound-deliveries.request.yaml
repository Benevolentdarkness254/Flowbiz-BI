$kind: http-request
name: List Inbound Deliveries
order: 6000
method: GET
url: '{{baseURL}}/api/deliveries/inbound'
queryParams:
  - key: status
    value: complete
    description: 'Filter by status: pending, partial, complete'
    disabled: true
  - key: supplier_id
    value: '1'
    description: Filter by supplier ID
    disabled: true
  - key: page
    value: '1'
  - key: per_page
    value: '25'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // ── List Inbound Deliveries ───────────────────────────────────────────
      pm.test('List Inbound Deliveries returns 200 or 401/403', function () {
          pm.expect([200, 401, 403]).to.include(pm.response.code);
      });

      if (pm.response.code === 200) {
          pm.test('Inbound deliveries response contains a list', function () {
              var json = pm.response.json();
              var list = Array.isArray(json) ? json : (json.deliveries || json.data);
              pm.expect(list).to.be.an('array');
          });

          pm.test('Each inbound delivery has id and supplier_id fields', function () {
              var json = pm.response.json();
              var list = Array.isArray(json) ? json : (json.deliveries || json.data);
              if (list.length > 0) {
                  pm.expect(list[0]).to.have.property('id');
                  pm.expect(list[0]).to.have.property('supplier_id');
              }
          });
      }