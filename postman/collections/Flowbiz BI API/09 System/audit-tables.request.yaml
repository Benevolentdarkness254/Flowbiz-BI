$kind: http-request
name: Audit Log - Distinct Tables
order: 2000
method: GET
url: '{{baseURL}}/api/system/audit/tables'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // ── Audit Log - Distinct Tables ───────────────────────────────────────
      pm.test('Audit Tables returns 200 or 401/403', function () {
          pm.expect([200, 401, 403]).to.include(pm.response.code);
      });

      if (pm.response.code === 200) {
          pm.test('Audit tables response is an array', function () {
              var json = pm.response.json();
              var list = Array.isArray(json) ? json : (json.tables || json.data);
              pm.expect(list).to.be.an('array');
          });

          pm.test('Each table entry is a string or has a name field', function () {
              var json = pm.response.json();
              var list = Array.isArray(json) ? json : (json.tables || json.data);
              if (list.length > 0) {
                  var isString = typeof list[0] === 'string';
                  var hasName = typeof list[0] === 'object' && list[0].hasOwnProperty('name');
                  pm.expect(isString || hasName).to.be.true;
              }
          });
      }