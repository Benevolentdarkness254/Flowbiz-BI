$kind: http-request
name: List Database Backups
order: 3000
method: GET
url: '{{baseURL}}/api/system/backups'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // ── List Database Backups ─────────────────────────────────────────────
      pm.test('List Backups returns 200 or 401/403', function () {
          pm.expect([200, 401, 403]).to.include(pm.response.code);
      });

      if (pm.response.code === 200) {
          pm.test('Backups response is an array', function () {
              var json = pm.response.json();
              var list = Array.isArray(json) ? json : (json.backups || json.data);
              pm.expect(list).to.be.an('array');
          });

          pm.test('Each backup has a filename or name field', function () {
              var json = pm.response.json();
              var list = Array.isArray(json) ? json : (json.backups || json.data);
              if (list.length > 0) {
                  var hasFilename = list[0].hasOwnProperty('filename') ||
                                    list[0].hasOwnProperty('name') ||
                                    list[0].hasOwnProperty('file');
                  pm.expect(hasFilename).to.be.true;
              }
          });

          // Save first backup filename for downstream delete test
          var json = pm.response.json();
          var list = Array.isArray(json) ? json : (json.backups || json.data);
          if (list.length > 0) {
              var filename = list[0].filename || list[0].name || list[0].file;
              if (filename) {
                  pm.collectionVariables.set('testBackupFilename', String(filename));
              }
          }
      }