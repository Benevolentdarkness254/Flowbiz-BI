$kind: http-request
name: Get System Logs
order: 8000
method: GET
url: '{{baseURL}}/api/system/logs'
queryParams:
  - key: lines
    value: '200'
    description: Number of recent log lines to return
  - key: level
    value: ERROR
    description: 'Filter by log level: DEBUG, INFO, WARNING, ERROR'
    disabled: true
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // ── Get System Logs ───────────────────────────────────────────────────
      pm.test('Get System Logs returns 200 or 401/403', function () {
          pm.expect([200, 401, 403]).to.include(pm.response.code);
      });

      if (pm.response.code === 200) {
          pm.test('System logs response is an array or object', function () {
              var json = pm.response.json();
              var isArrayOrObject = Array.isArray(json) || typeof json === 'object';
              pm.expect(isArrayOrObject).to.be.true;
          });

          pm.test('System logs has log entries', function () {
              var json = pm.response.json();
              var list = Array.isArray(json) ? json : (json.logs || json.data);
              if (Array.isArray(list) && list.length > 0) {
                  // Each log entry should have a level or message field
                  var hasLogField = list[0].hasOwnProperty('level') ||
                                    list[0].hasOwnProperty('message') ||
                                    list[0].hasOwnProperty('timestamp') ||
                                    typeof list[0] === 'string';
                  pm.expect(hasLogField).to.be.true;
              }
          });
      }