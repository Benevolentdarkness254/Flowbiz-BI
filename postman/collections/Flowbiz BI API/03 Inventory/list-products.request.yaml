$kind: http-request
name: List Products
order: 1000
method: GET
url: '{{baseURL}}/api/inventory/products'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // ── List Products ─────────────────────────────────────────────────────
      pm.test('List Products returns 200 or 401/403', function () {
          pm.expect([200, 401, 403]).to.include(pm.response.code);
      });

      if (pm.response.code === 200) {
          pm.test('Products response contains a list', function () {
              var json = pm.response.json();
              var list = Array.isArray(json) ? json : (json.products || json.data);
              pm.expect(list).to.be.an('array');
          });

          pm.test('Each product has id, name, and current_stock fields', function () {
              var json = pm.response.json();
              var list = Array.isArray(json) ? json : (json.products || json.data);
              if (list.length > 0) {
                  pm.expect(list[0]).to.have.property('id');
                  pm.expect(list[0]).to.have.property('name');
                  // current_stock or quantity_in_stock
                  var hasStock = list[0].hasOwnProperty('current_stock') ||
                                 list[0].hasOwnProperty('quantity_in_stock');
                  pm.expect(hasStock).to.be.true;
              }
          });
      }