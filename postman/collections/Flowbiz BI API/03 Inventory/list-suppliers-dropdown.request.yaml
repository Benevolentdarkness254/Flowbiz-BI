$kind: http-request
name: 'List Suppliers (dropdown, active only)'
order: 5000
method: GET
url: '{{baseURL}}/api/inventory/suppliers'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // ── List Suppliers Dropdown ───────────────────────────────────────────
      pm.test('Suppliers dropdown returns 200 or 401/403', function () {
          pm.expect([200, 401, 403]).to.include(pm.response.code);
      });

      if (pm.response.code === 200) {
          pm.test('Suppliers dropdown is an array', function () {
              var json = pm.response.json();
              var list = Array.isArray(json) ? json : (json.suppliers || json.data);
              pm.expect(list).to.be.an('array');
          });

          pm.test('Each supplier entry has id and name', function () {
              var json = pm.response.json();
              var list = Array.isArray(json) ? json : (json.suppliers || json.data);
              if (list.length > 0) {
                  pm.expect(list[0]).to.have.property('id');
                  pm.expect(list[0]).to.have.property('name');
              }
          });
      }