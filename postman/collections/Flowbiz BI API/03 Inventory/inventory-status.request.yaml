$kind: http-request
name: 'Inventory Status (view)'
order: 2000
method: GET
url: '{{baseURL}}/api/inventory/status'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // ── Inventory Status ──────────────────────────────────────────────────
      pm.test('Inventory Status returns 200 or 401/403', function () {
          pm.expect([200, 401, 403]).to.include(pm.response.code);
      });

      if (pm.response.code === 200) {
          pm.test('Inventory status response is an object or array', function () {
              var json = pm.response.json();
              pm.expect(json).to.be.oneOf([
                  pm.expect(json).to.be.an('object'),
                  pm.expect(json).to.be.an('array')
              ]);
          });
      }