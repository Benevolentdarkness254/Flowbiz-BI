$kind: http-request
name: Stock Alerts
order: 4000
method: GET
url: '{{baseURL}}/api/inventory/alerts'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // ── Stock Alerts ──────────────────────────────────────────────────────
      pm.test('Stock Alerts returns 200 or 401/403', function () {
          pm.expect([200, 401, 403]).to.include(pm.response.code);
      });

      if (pm.response.code === 200) {
          pm.test('Stock alerts response is an array', function () {
              var json = pm.response.json();
              var list = Array.isArray(json) ? json : (json.alerts || json.data);
              pm.expect(list).to.be.an('array');
          });

          pm.test('Each alert has product_id and alert_type fields', function () {
              var json = pm.response.json();
              var list = Array.isArray(json) ? json : (json.alerts || json.data);
              if (list.length > 0) {
                  pm.expect(list[0]).to.have.property('product_id');
              }
          });
      }