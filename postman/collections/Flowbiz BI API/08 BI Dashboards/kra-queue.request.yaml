$kind: http-request
name: KRA eTIMS Queue
order: 8000
method: GET
url: '{{baseURL}}/api/bi/kra-queue'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // ── KRA eTIMS Queue ───────────────────────────────────────────────────
      pm.test('KRA Queue returns 200 or 401/403', function () {
          pm.expect([200, 401, 403]).to.include(pm.response.code);
      });

      if (pm.response.code === 200) {
          pm.test('KRA queue response is an array or object', function () {
              var json = pm.response.json();
              var isArrayOrObject = Array.isArray(json) || typeof json === 'object';
              pm.expect(isArrayOrObject).to.be.true;
          });

          pm.test('KRA queue has pending or submitted items', function () {
              var json = pm.response.json();
              var list = Array.isArray(json) ? json : (json.queue || json.items || json.data);
              // Queue may be empty — just verify it is an array
              if (Array.isArray(list)) {
                  pm.expect(list).to.be.an('array');
              }
          });
      }