$kind: http-request
name: Revenue Summary
order: 6000
method: GET
url: '{{baseURL}}/api/bi/revenue'
queryParams:
  - key: start_date
    value: '2025-07-01'
    description: 'Start date (YYYY-MM-DD). Defaults to 30 days ago.'
    disabled: true
  - key: end_date
    value: '2025-07-31'
    description: 'End date (YYYY-MM-DD). Defaults to today.'
    disabled: true
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // ── Revenue Summary ───────────────────────────────────────────────────
      pm.test('Revenue Summary returns 200 or 401/403', function () {
          pm.expect([200, 401, 403]).to.include(pm.response.code);
      });

      if (pm.response.code === 200) {
          pm.test('Revenue summary response is an object', function () {
              var json = pm.response.json();
              pm.expect(json).to.be.an('object');
          });

          pm.test('Revenue summary has total_revenue or revenue field', function () {
              var json = pm.response.json();
              var data = json.revenue || json;
              var hasRevenue = data.hasOwnProperty('total_revenue') ||
                               data.hasOwnProperty('revenue') ||
                               data.hasOwnProperty('gross_revenue');
              pm.expect(hasRevenue).to.be.true;
          });
      }