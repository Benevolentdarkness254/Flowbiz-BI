$kind: http-request
name: Dashboard - Sales Staff View
order: 2000
method: GET
url: '{{baseURL}}/api/bi/dashboard/sales'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // ── Dashboard - Sales Staff View ──────────────────────────────────────
      pm.test('Sales Dashboard returns 200 or 401/403', function () {
          pm.expect([200, 401, 403]).to.include(pm.response.code);
      });

      if (pm.response.code === 200) {
          pm.test('Sales dashboard response is an object', function () {
              var json = pm.response.json();
              pm.expect(json).to.be.an('object');
          });
      }