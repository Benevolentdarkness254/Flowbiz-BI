$kind: http-request
name: Purchase Order Analytics
order: 11000
method: GET
url: '{{baseURL}}/api/bi/purchase-orders/analytics'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // ── Purchase Order Analytics ──────────────────────────────────────────
      pm.test('PO Analytics returns 200 or 401/403', function () {
          pm.expect([200, 401, 403]).to.include(pm.response.code);
      });

      if (pm.response.code === 200) {
          pm.test('PO analytics response is an object', function () {
              var json = pm.response.json();
              pm.expect(json).to.be.an('object');
          });

          pm.test('PO analytics has order metrics', function () {
              var json = pm.response.json();
              var data = json.analytics || json;
              var hasMetric = data.hasOwnProperty('total_orders') ||
                              data.hasOwnProperty('total_po') ||
                              data.hasOwnProperty('pending_count') ||
                              data.hasOwnProperty('approved_count');
              pm.expect(hasMetric).to.be.true;
          });
      }