$kind: http-request
name: Customer Lifetime Value Summary
order: 7000
method: GET
url: '{{baseURL}}/api/bi/customers'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // ── Customer Lifetime Value Summary ───────────────────────────────────
      pm.test('Customer Summary returns 200 or 401/403', function () {
          pm.expect([200, 401, 403]).to.include(pm.response.code);
      });

      if (pm.response.code === 200) {
          pm.test('Customer summary response is an array or object', function () {
              var json = pm.response.json();
              var isArrayOrObject = Array.isArray(json) || typeof json === 'object';
              pm.expect(isArrayOrObject).to.be.true;
          });

          pm.test('Customer summary has customer data', function () {
              var json = pm.response.json();
              var list = Array.isArray(json) ? json : (json.customers || json.data);
              if (Array.isArray(list) && list.length > 0) {
                  pm.expect(list[0]).to.have.property('id');
              }
          });
      }