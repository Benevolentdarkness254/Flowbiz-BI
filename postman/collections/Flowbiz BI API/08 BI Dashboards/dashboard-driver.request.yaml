$kind: http-request
name: Dashboard - Driver View
order: 4000
method: GET
url: '{{baseURL}}/api/bi/dashboard/driver'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // ── Dashboard - Driver View ───────────────────────────────────────────
      pm.test('Driver Dashboard returns 200 or 401/403', function () {
          pm.expect([200, 401, 403]).to.include(pm.response.code);
      });

      if (pm.response.code === 200) {
          pm.test('Driver dashboard response is an object', function () {
              var json = pm.response.json();
              pm.expect(json).to.be.an('object');
          });
      }