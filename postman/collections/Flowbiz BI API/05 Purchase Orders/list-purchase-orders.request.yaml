$kind: http-request
name: List Purchase Orders
order: 1000
method: GET
url: '{{baseURL}}/api/purchase-orders/'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // ── List Purchase Orders ──────────────────────────────────────────────
      pm.test('List Purchase Orders returns 200 or 401/403', function () {
          pm.expect([200, 401, 403]).to.include(pm.response.code);
      });

      if (pm.response.code === 200) {
          pm.test('Purchase orders response contains a list', function () {
              var json = pm.response.json();
              var list = Array.isArray(json) ? json : (json.purchase_orders || json.data);
              pm.expect(list).to.be.an('array');
          });

          pm.test('Each PO has id and status fields', function () {
              var json = pm.response.json();
              var list = Array.isArray(json) ? json : (json.purchase_orders || json.data);
              if (list.length > 0) {
                  pm.expect(list[0]).to.have.property('id');
                  pm.expect(list[0]).to.have.property('status');
              }
          });

          // Save first PO id for downstream tests
          var json = pm.response.json();
          var list = Array.isArray(json) ? json : (json.purchase_orders || json.data);
          if (list.length > 0) {
              pm.collectionVariables.set('testPurchaseOrderId', String(list[0].id));
          }
      }