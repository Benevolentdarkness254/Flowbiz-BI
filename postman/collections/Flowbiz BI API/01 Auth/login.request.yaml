$kind: http-request
name: Login
order: 1000
method: POST
url: '{{baseURL}}/api/auth/login'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "username": "{{testUsername}}",
      "password": "{{testPassword}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // ── Login — success path ──────────────────────────────────────────────
      pm.test('Login returns 200 OK', function () {
          pm.response.to.have.status(200);
      });

      pm.test('Login response contains user object', function () {
          var json = pm.response.json();
          pm.expect(json).to.have.property('user');
          pm.expect(json.user).to.have.property('id');
          pm.expect(json.user).to.have.property('username');
          pm.expect(json.user).to.have.property('role');
      });

      pm.test('Login response contains a message field', function () {
          var json = pm.response.json();
          pm.expect(json).to.have.property('message');
      });

      // Save user details as collection variables for downstream requests
      if (pm.response.code === 200) {
          var body = pm.response.json();
          if (body.user && body.user.id) {
              pm.collectionVariables.set('loggedInUserId', String(body.user.id));
          }
      }