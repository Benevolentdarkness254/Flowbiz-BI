$kind: http-request
name: 'Debug Permissions (admin only)'
order: 11000
method: GET
url: '{{baseURL}}/api/auth/permissions/debug'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // ── Debug Permissions (admin only) ────────────────────────────────────
      // Only system_admin should reach this; others get 401/403.
      pm.test('Debug Permissions returns 200, 401, or 403', function () {
          pm.expect([200, 401, 403]).to.include(pm.response.code);
      });

      if (pm.response.code === 200) {
          pm.test('Permissions debug response is an object', function () {
              var json = pm.response.json();
              pm.expect(json).to.be.an('object');
          });
      }

      if (pm.response.code === 403) {
          pm.test('Forbidden response has error or message field', function () {
              var json = pm.response.json();
              pm.expect(json.error || json.message).to.exist;
          });
      }