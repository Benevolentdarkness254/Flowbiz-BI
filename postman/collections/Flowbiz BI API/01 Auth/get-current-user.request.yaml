$kind: http-request
name: 'Get Current User (me)'
order: 3000
method: GET
url: '{{baseURL}}/api/auth/me'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // ── Get Current User (/me) ────────────────────────────────────────────
      // When authenticated this should return 200 with the user profile.
      // When not authenticated it should return 401.
      pm.test('Get Current User returns 200 (authenticated) or 401 (not logged in)', function () {
          pm.expect([200, 401]).to.include(pm.response.code);
      });

      if (pm.response.code === 200) {
          pm.test('User profile has id, username, and role fields', function () {
              var json = pm.response.json();
              pm.expect(json).to.have.property('id');
              pm.expect(json).to.have.property('username');
              pm.expect(json).to.have.property('role');
          });
      }

      if (pm.response.code === 401) {
          pm.test('Unauthenticated /me returns error message', function () {
              var json = pm.response.json();
              pm.expect(json).to.have.property('error');
          });
      }