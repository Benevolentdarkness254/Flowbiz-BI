$kind: http-request
name: Update User
order: 7000
method: PUT
url: '{{baseURL}}/api/auth/users/{{testUserId}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "full_name": "Jane Doe Updated",
      "email": "jdoe.updated@example.com",
      "phone": "+254700000002",
      "is_active": true
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // ── Update User ───────────────────────────────────────────────────────
      // 200 = updated, 400 = validation, 401/403 = auth, 404 = not found
      pm.test('Update User returns 200, 400, 401, 403, or 404', function () {
          pm.expect([200, 400, 401, 403, 404]).to.include(pm.response.code);
      });

      if (pm.response.code === 200) {
          pm.test('Updated user response has id field', function () {
              var json = pm.response.json();
              var user = json.user || json;
              pm.expect(user).to.have.property('id');
          });
      }

      if ([400, 404].includes(pm.response.code)) {
          pm.test('Error response has error or message field', function () {
              var json = pm.response.json();
              pm.expect(json.error || json.message).to.exist;
          });
      }