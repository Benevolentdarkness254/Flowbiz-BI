$kind: http-request
name: Delete User (soft)
order: 8000
method: DELETE
url: '{{baseURL}}/api/auth/users/{{testUserId}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // ── Delete User (soft delete) ─────────────────────────────────────────
      // 200/204 = deleted, 401/403 = auth, 404 = not found
      pm.test('Delete User returns 200, 204, 401, 403, or 404', function () {
          pm.expect([200, 204, 401, 403, 404]).to.include(pm.response.code);
      });

      if (pm.response.code === 200) {
          pm.test('Delete response has a message field', function () {
              var json = pm.response.json();
              pm.expect(json.message || json.success).to.exist;
          });
      }