$kind: http-request
name: Suspend Supplier
order: 8000
method: POST
url: '{{baseURL}}/api/suppliers/{{testSupplierId}}/suspend'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // ── Suspend Supplier ──────────────────────────────────────────────────
      pm.test('Suspend Supplier returns 200, 400, 401, 403, or 404', function () {
          pm.expect([200, 400, 401, 403, 404]).to.include(pm.response.code);
      });

      if (pm.response.code === 200) {
          pm.test('Suspend response has message or supplier field', function () {
              var json = pm.response.json();
              pm.expect(json.message || json.supplier).to.exist;
          });
      }