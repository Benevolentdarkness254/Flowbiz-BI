$kind: http-request
name: Supplier Performance Analytics
order: 10000
method: GET
url: '{{baseURL}}/api/suppliers/{{testSupplierId}}/performance'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // ── Supplier Performance Analytics ────────────────────────────────────
      pm.test('Supplier Performance returns 200, 401, 403, or 404', function () {
          pm.expect([200, 401, 403, 404]).to.include(pm.response.code);
      });

      if (pm.response.code === 200) {
          pm.test('Performance response is an object', function () {
              var json = pm.response.json();
              pm.expect(json).to.be.an('object');
          });

          pm.test('Performance data has at least one metric field', function () {
              var json = pm.response.json();
              var data = json.performance || json;
              // Expect at least one of these common performance metrics
              var hasMetric = data.hasOwnProperty('total_orders') ||
                              data.hasOwnProperty('on_time_delivery_rate') ||
                              data.hasOwnProperty('total_deliveries') ||
                              data.hasOwnProperty('fill_rate');
              pm.expect(hasMetric).to.be.true;
          });
      }