$kind: http-request
name: List Suppliers
order: 1000
method: GET
url: '{{baseURL}}/api/suppliers/'
queryParams:
  - key: approval_status
    value: approved
    description: 'Filter by status: pending, approved, rejected, suspended'
    disabled: true
  - key: is_active
    value: 'true'
    description: Filter by active flag
    disabled: true
  - key: page
    value: '1'
  - key: per_page
    value: '25'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // ── List Suppliers ────────────────────────────────────────────────────
      pm.test('List Suppliers returns 200 or 401/403', function () {
          pm.expect([200, 401, 403]).to.include(pm.response.code);
      });

      if (pm.response.code === 200) {
          pm.test('Suppliers response contains a list', function () {
              var json = pm.response.json();
              var list = Array.isArray(json) ? json : (json.suppliers || json.data);
              pm.expect(list).to.be.an('array');
          });

          pm.test('Each supplier has id and name fields', function () {
              var json = pm.response.json();
              var list = Array.isArray(json) ? json : (json.suppliers || json.data);
              if (list.length > 0) {
                  pm.expect(list[0]).to.have.property('id');
                  pm.expect(list[0]).to.have.property('name');
              }
          });

          // Save first supplier id for downstream tests
          var json = pm.response.json();
          var list = Array.isArray(json) ? json : (json.suppliers || json.data);
          if (list.length > 0) {
              pm.collectionVariables.set('testSupplierId', String(list[0].id));
          }
      }