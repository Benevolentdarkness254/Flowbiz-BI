$kind: http-request
name: Update Supplier
order: 4000
method: PUT
url: '{{baseURL}}/api/suppliers/{{testSupplierId}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "payment_terms": 45,
      "notes": "Updated payment terms after renegotiation",
      "is_active": true
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // ── Update Supplier ───────────────────────────────────────────────────
      pm.test('Update Supplier returns 200, 400, 401, 403, or 404', function () {
          pm.expect([200, 400, 401, 403, 404]).to.include(pm.response.code);
      });

      if (pm.response.code === 200) {
          pm.test('Updated supplier has id and name', function () {
              var json = pm.response.json();
              var supplier = json.supplier || json;
              pm.expect(supplier).to.have.property('id');
              pm.expect(supplier).to.have.property('name');
          });
      }

      if ([400, 404].includes(pm.response.code)) {
          pm.test('Error response has error or message field', function () {
              var json = pm.response.json();
              pm.expect(json.error || json.message).to.exist;
          });
      }