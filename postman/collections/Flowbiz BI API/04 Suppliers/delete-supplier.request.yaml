$kind: http-request
name: Delete Supplier (soft)
order: 5000
method: DELETE
url: '{{baseURL}}/api/suppliers/{{testSupplierId}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // ── Delete Supplier (soft delete) ─────────────────────────────────────
      pm.test('Delete Supplier returns 200, 204, 401, 403, or 404', function () {
          pm.expect([200, 204, 401, 403, 404]).to.include(pm.response.code);
      });

      if (pm.response.code === 200) {
          pm.test('Delete response has a message field', function () {
              var json = pm.response.json();
              pm.expect(json.message || json.success).to.exist;
          });
      }