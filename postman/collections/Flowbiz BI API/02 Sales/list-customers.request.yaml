$kind: http-request
name: List Customers
order: 4000
method: GET
url: '{{baseURL}}/api/sales/customers'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // ── List Customers ────────────────────────────────────────────────────
      pm.test('List Customers returns 200 or 401/403', function () {
          pm.expect([200, 401, 403]).to.include(pm.response.code);
      });

      if (pm.response.code === 200) {
          pm.test('Customers response contains a list', function () {
              var json = pm.response.json();
              var list = Array.isArray(json) ? json : (json.customers || json.data);
              pm.expect(list).to.be.an('array');
          });

          pm.test('Each customer has id and name fields', function () {
              var json = pm.response.json();
              var list = Array.isArray(json) ? json : (json.customers || json.data);
              if (list.length > 0) {
                  pm.expect(list[0]).to.have.property('id');
                  pm.expect(list[0]).to.have.property('name');
              }
          });

          // Save first customer id for downstream tests
          var json = pm.response.json();
          var list = Array.isArray(json) ? json : (json.customers || json.data);
          if (list.length > 0) {
              pm.collectionVariables.set('testCustomerId', String(list[0].id));
          }
      }