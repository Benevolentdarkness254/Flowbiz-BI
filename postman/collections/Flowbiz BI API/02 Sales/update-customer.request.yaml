$kind: http-request
name: Update Customer
order: 7000
method: PUT
url: '{{baseURL}}/api/sales/customers/{{testCustomerId}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Acme Ltd Updated",
      "phone": "+254700000011",
      "zone": "Zone B",
      "credit_limit": 75000
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // ── Update Customer ───────────────────────────────────────────────────
      pm.test('Update Customer returns 200, 400, 401, 403, or 404', function () {
          pm.expect([200, 400, 401, 403, 404]).to.include(pm.response.code);
      });

      if (pm.response.code === 200) {
          pm.test('Updated customer has id and name', function () {
              var json = pm.response.json();
              var customer = json.customer || json;
              pm.expect(customer).to.have.property('id');
              pm.expect(customer).to.have.property('name');
          });
      }

      if ([400, 404].includes(pm.response.code)) {
          pm.test('Error response has error or message field', function () {
              var json = pm.response.json();
              pm.expect(json.error || json.message).to.exist;
          });
      }