$kind: http-request
name: Get Transaction by ID
order: 3000
method: GET
url: '{{baseURL}}/api/sales/transactions/{{testTransactionId}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // ── Get Transaction by ID ─────────────────────────────────────────────
      // Depends on testTransactionId being set by List/Create Transaction.
      pm.test('Get Transaction returns 200, 401, 403, or 404', function () {
          pm.expect([200, 401, 403, 404]).to.include(pm.response.code);
      });

      if (pm.response.code === 200) {
          pm.test('Transaction object has id and total_amount', function () {
              var json = pm.response.json();
              var tx = json.transaction || json;
              pm.expect(tx).to.have.property('id');
              pm.expect(tx).to.have.property('total_amount');
          });

          pm.test('Transaction has items array', function () {
              var json = pm.response.json();
              var tx = json.transaction || json;
              pm.expect(tx.items || tx.line_items).to.be.an('array');
          });
      }

      if (pm.response.code === 404) {
          pm.test('Not-found response has error or message field', function () {
              var json = pm.response.json();
              pm.expect(json.error || json.message).to.exist;
          });
      }