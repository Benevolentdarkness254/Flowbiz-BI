$kind: http-request
name: List Sale Transactions
order: 1000
method: GET
url: '{{baseURL}}/api/sales/transactions'
queryParams:
  - key: page
    value: '1'
    description: Page number
  - key: per_page
    value: '25'
    description: Results per page
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // ── List Sale Transactions ────────────────────────────────────────────
      pm.test('List Transactions returns 200 or 401/403', function () {
          pm.expect([200, 401, 403]).to.include(pm.response.code);
      });

      if (pm.response.code === 200) {
          pm.test('Transactions response contains a list', function () {
              var json = pm.response.json();
              var list = Array.isArray(json) ? json : (json.transactions || json.data);
              pm.expect(list).to.be.an('array');
          });

          pm.test('Each transaction has id and total_amount fields', function () {
              var json = pm.response.json();
              var list = Array.isArray(json) ? json : (json.transactions || json.data);
              if (list.length > 0) {
                  pm.expect(list[0]).to.have.property('id');
                  pm.expect(list[0]).to.have.property('total_amount');
              }
          });

          // Save first transaction id for downstream tests
          var json = pm.response.json();
          var list = Array.isArray(json) ? json : (json.transactions || json.data);
          if (list.length > 0) {
              pm.collectionVariables.set('testTransactionId', String(list[0].id));
          }
      }