$kind: http-request
name: Get Customer by ID
order: 6000
method: GET
url: '{{baseURL}}/api/sales/customers/{{testCustomerId}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // ── Get Customer by ID ────────────────────────────────────────────────
      pm.test('Get Customer returns 200, 401, 403, or 404', function () {
          pm.expect([200, 401, 403, 404]).to.include(pm.response.code);
      });

      if (pm.response.code === 200) {
          pm.test('Customer object has id and name', function () {
              var json = pm.response.json();
              var customer = json.customer || json;
              pm.expect(customer).to.have.property('id');
              pm.expect(customer).to.have.property('name');
          });
      }

      if (pm.response.code === 404) {
          pm.test('Not-found response has error or message field', function () {
              var json = pm.response.json();
              pm.expect(json.error || json.message).to.exist;
          });
      }