$kind: http-request
name: List Receipts
order: 1000
method: GET
url: '{{baseURL}}/api/receipts/'
queryParams:
  - key: page
    value: '1'
  - key: per_page
    value: '25'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // ── List Receipts ─────────────────────────────────────────────────────
      pm.test('List Receipts returns 200 or 401/403', function () {
          pm.expect([200, 401, 403]).to.include(pm.response.code);
      });

      if (pm.response.code === 200) {
          pm.test('Receipts response contains a list', function () {
              var json = pm.response.json();
              var list = Array.isArray(json) ? json : (json.receipts || json.data);
              pm.expect(list).to.be.an('array');
          });

          pm.test('Each receipt has id and status fields', function () {
              var json = pm.response.json();
              var list = Array.isArray(json) ? json : (json.receipts || json.data);
              if (list.length > 0) {
                  pm.expect(list[0]).to.have.property('id');
                  pm.expect(list[0]).to.have.property('status');
              }
          });

          // Save first receipt id for downstream tests
          var json = pm.response.json();
          var list = Array.isArray(json) ? json : (json.receipts || json.data);
          if (list.length > 0) {
              pm.collectionVariables.set('testReceiptId', String(list[0].id));
          }
      }