$kind: http-request
name: Dispatch Receipt (reprint/resend)
order: 4000
method: POST
url: '{{baseURL}}/api/receipts/{{testReceiptId}}/dispatch'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "channel": "sms",
      "destination": "+254700000010"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // ── Dispatch Receipt (reprint/resend) ─────────────────────────────────
      // 200 = dispatched, 400 = invalid channel/destination, 401/403 = auth,
      // 404 = receipt not found, 503 = SMS/email service unavailable
      pm.test('Dispatch Receipt returns 200, 400, 401, 403, 404, or 503', function () {
          pm.expect([200, 400, 401, 403, 404, 503]).to.include(pm.response.code);
      });

      if (pm.response.code === 200) {
          pm.test('Dispatch response has message field', function () {
              var json = pm.response.json();
              pm.expect(json.message || json.success).to.exist;
          });
      }

      if ([400, 503].includes(pm.response.code)) {
          pm.test('Error response has error or message field', function () {
              var json = pm.response.json();
              pm.expect(json.error || json.message).to.exist;
          });
      }