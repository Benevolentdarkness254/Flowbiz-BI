$kind: http-request
name: Void Receipt
order: 3000
method: POST
url: '{{baseURL}}/api/receipts/{{testReceiptId}}/void'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "reason": "Customer returned goods — duplicate payment"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // ── Void Receipt ──────────────────────────────────────────────────────
      // Mutating endpoint — reverses a receipt. Test error handling carefully.
      // 200 = voided, 400 = already voided/dispatched, 401/403 = auth, 404 = not found
      pm.test('Void Receipt returns 200, 400, 401, 403, or 404', function () {
          pm.expect([200, 400, 401, 403, 404]).to.include(pm.response.code);
      });

      if (pm.response.code === 200) {
          pm.test('Void response has message or receipt field', function () {
              var json = pm.response.json();
              pm.expect(json.message || json.receipt).to.exist;
          });
      }

      if (pm.response.code === 400) {
          pm.test('Cannot void error has error or message field', function () {
              var json = pm.response.json();
              pm.expect(json.error || json.message).to.exist;
          });
      }